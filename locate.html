<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>位置定位</title>
<style>
:root{
  --bg:#ffffff; --surface:#f6f8fa; --card:#ffffff; --border:#d0d7de; --soft:#eaeef2;
  --text:#1f2328; --muted:#656d76; --accent:#0969da; --accent-soft:#ddf4ff;
  --green:#1a7f37; --red:#cf222e; --red-soft:#ffecec; --shadow:0 1px 3px rgba(31,35,40,.08);
}
[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b22; --card:#0d1117; --border:#30363d; --soft:#21262d;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent-soft:#121d2f;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:4px 0 18px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);
  border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--soft)}
.muted{color:var(--muted);font-size:13px}
.card-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row:last-child{margin-bottom:0}
select,input[type=text],input[type=password]{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);
  border-radius:6px;padding:6px 10px;outline:none}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{background:#0a5fc2}
#fCoord{font-size:13px}
.box-t{font-size:15px;margin:0 0 10px;font-weight:600}
#parseInput{flex:1;min-width:200px}
.sec{margin-bottom:18px}
.sec h3{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec .cnt{font-size:12px;color:var(--muted);background:var(--soft);border-radius:10px;padding:1px 8px}
.item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.item .addr{font-size:14px;word-break:break-all}
.item .addr-row{display:flex;align-items:center;gap:12px;font-size:14px}
.item .addr-row .addr{word-break:break-all}
.item .addr-row .ftime{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.item .addr-row .del{border:none;background:none;color:var(--red);padding:2px 4px;font-size:12px}
.item .meta{display:flex;align-items:center;gap:12px;margin-top:4px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.item .meta a{color:var(--accent);text-decoration:none}
.item .meta .del{border:none;background:none;color:var(--red);padding:2px 4px;font-size:12px}
.item .meta .rep{border:none;background:none;color:var(--accent);padding:2px 4px;font-size:12px}
.rel-link{font-size:12px;color:var(--muted);cursor:pointer;user-select:none;word-break:break-all;min-width:0;flex:1 1 auto}
.rel-link u{text-decoration:none}
.rel-link:hover{color:var(--accent);opacity:.9}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}

/* 同步面板（与 todo/price/bookmark/birthday 同一套） */
.sync{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-top:8px;box-shadow:var(--shadow)}
.sync-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.sync-tip{font-size:12px;color:var(--muted)}
.sync-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sync-row label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync-row label.grow{flex:1;min-width:260px}
.sync-row input[type=text],.sync-row input[type=password]{flex:1;min-width:120px}
.sync-row .slash{color:var(--muted)}
.sync-msg{font-size:12px;margin-left:auto}
.sync-msg.ok{color:var(--green)}
.sync-msg.err{color:var(--red)}

.foot{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
.conn{margin-top:14px;text-align:center;color:var(--muted);font-size:13px}
.conn button{padding:5px 14px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px}
.conn button:hover{border-color:var(--accent)}
.conn-msg{margin-left:10px}
.conn-msg.ok{color:var(--ok)}
.conn-msg.err{color:var(--danger)}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
#toast.show{opacity:.95}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>位置定位</h1>
    <div class="tools">
      <button id="themeBtn">暗色</button>
      <button id="exportBtn" title="把位置数据导出成 JSON 文件（备份/迁移）">导出</button>
      <button id="importBtn" title="从 JSON 文件导入位置数据（覆盖前自动备份）">导入</button>
      <button id="syncBtn" title="GitHub 同步设置">同步</button>
    </div>
  </div>
  <p class="sub" id="subText">管理页：把家人发来的坐标文本（序号,经度,纬度,时间）粘到下方「解析」框即可录入；每个关系标题下方有该家人的上报链接，点一下就能复制发给他/她。</p>

  <div class="sync" id="syncPanel" hidden>
    <div class="sync-head">
      <strong>GitHub 同步</strong>
      <span class="sync-tip">「更新到Github」= 把当前位置数据写成 locate.json 上传（app 本身 locate.html 不上传）；「从Github更新」= 读回远端 locate.json 数据合并到本地（旧数据自动备份）</span>
    </div>
    <div class="sync-row">
      <label>仓库 owner/repo
        <input type="text" id="sOwner" placeholder="yourname" autocomplete="off">
        <span class="slash">/</span>
        <input type="text" id="sRepo" placeholder="sync" autocomplete="off">
      </label>
      <label>分支<input type="text" id="sBranch" placeholder="main" autocomplete="off"></label>
      <label>文件路径<input type="text" id="sPath" placeholder="locate.json" autocomplete="off"></label>
    </div>
    <div class="sync-row">
      <label class="grow">Token（fine-grained，仅授权该仓库 contents 读写）
        <input type="password" id="sToken" placeholder="github_pat_xxx" autocomplete="off">
      </label>
    </div>
    <div class="sync-row">
      <button id="saveSyncBtn">保存配置</button>
      <button class="primary" id="pushBtn">更新到Github</button>
      <button id="pullBtn">从Github更新</button>
      <span id="syncMsg" class="sync-msg"></span>
    </div>
  </div>

  <div class="card-box" id="inputCard">
    <div class="row" id="relRow">
      <label id="relLabel">关系</label>
      <select id="relSel">
        <option value="1">配偶</option><option value="2">子女</option><option value="3">本人</option><option value="4">父</option><option value="5">母</option>
      </select>
      <span id="famWrap" style="display:none">您正在上报：<b id="famRelName"></b></span>
      <button id="famLinkBtn">复制家人链接</button>
      <button id="locBtn" class="primary">获取坐标</button>
      <span id="locStatus" class="muted"></span>
    </div>
    <div class="row" id="coordRow" style="display:none">
      <input id="fCoord" type="text" readonly placeholder="序号,经度,纬度,时间" style="flex:1;min-width:280px">
      <button id="copyCoordBtn">复制</button>
    </div>
  </div>

  <div class="card-box" id="parseBox">
    <h3 class="box-t">解析对方发来的坐标</h3>
    <div class="row">
      <input id="parseInput" type="text" placeholder="粘贴：序号,经度,纬度,时间（如 2,121.47,31.23,2026-11-14 09:00）">
      <button id="parseBtn" class="primary">解析</button>
    </div>
    <div class="muted" id="parseMsg"></div>
  </div>

  <div id="list"></div>

  <p class="foot">用爱 守护家人</p>
  <div class="conn" id="connBox">
    <button id="connBtn">连通性检测</button>
    <span id="connMsg" class="conn-msg"></span>
  </div>
</div>
<input type="file" id="importInput" accept=".json,application/json" hidden>
<div id="toast"></div>
<script>
const RELS=["配偶","子女","本人","父","母"];
const NUM_TO_CN={1:"配偶",2:"子女",3:"本人",4:"父",5:"母"};
const CN_TO_NUM={"配偶":1,"子女":2,"本人":3,"父":4,"母":5};
const KEY="locate_v1";
/* 家人链接模式：?relation=1~5 → 仅显示该关系、隐藏同步与解析 */
const FAM_PARAM=new URLSearchParams(location.search).get("relation");
const isFamily=/^[1-5]$/.test(FAM_PARAM||"");
const familyRelNum=isFamily?Number(FAM_PARAM):null;
const familyRelName=isFamily?NUM_TO_CN[familyRelNum]:null;
const SYNC_KEY="locate_sync";
/* 家人端自动上传用的写入令牌：在此粘贴你的 fine-grained PAT（仅授权 sync 仓库 contents 读写）。
   留空则家人页只本地记录+复制文本，不会上传到 GitHub。优先级低于本地同步配置里的 token。 */
const FAMILY_TOKEN="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";
const viewRel = isFamily ? familyRelName : null;
let state={records:[]};

function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.records) state=s; }catch(e){ } }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

/* 主题 */
const themeBtn=document.getElementById("themeBtn");
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  localStorage.setItem("locate_theme",t);
  themeBtn.textContent = t==="dark" ? "亮色" : "暗色";
}
let st=localStorage.getItem("locate_theme");
if(!st) st=(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
applyTheme(st);
themeBtn.onclick=()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1800);
}

/* 旧 ?d= 分享链接自动录入已移除：现改用 ?relation= 家人链接 + 文本解析 */

/* 接收端：用坐标反向解析成地址（Nominatim 免 key；家人端只上传坐标） */
function geocodeRecord(rec){
  if(!rec || rec.addr || rec.geoPending) return;
  rec.geoPending=true; renderList();
  fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+rec.lat+"&lon="+rec.lng+"&zoom=18&accept-language=zh-CN")
    .then(r=>r.json())
    .then(j=>{ rec.addr=j.display_name||""; rec.geoPending=false; rec.geoErr=!rec.addr; save(); renderList(); })
    .catch(()=>{ rec.geoPending=false; rec.geoErr=true; save(); renderList(); });
}

/* 定位 + 坐标文本 */
const locBtn=document.getElementById("locBtn");
const locStatus=document.getElementById("locStatus");
const coordRow=document.getElementById("coordRow");
const famLinkBtn=document.getElementById("famLinkBtn");
const copyCoordBtn=document.getElementById("copyCoordBtn");

locBtn.onclick=()=>{
  if(!navigator.geolocation){ locStatus.textContent="此浏览器不支持定位"; return; }
  locStatus.textContent="定位中…";
  navigator.geolocation.getCurrentPosition(gotPosition, onLocErr, {enableHighAccuracy:true,timeout:10000});
};
function onLocErr(err){
  locStatus.textContent="定位失败："+(err.message||err.code)+"（请再点一次「获取坐标」授权）";
}
function gotPosition(pos){
  const lat=pos.coords.latitude, lng=pos.coords.longitude;
  const seq = isFamily ? String(familyRelNum) : document.getElementById("relSel").value;
  const now=Date.now();
  // 坐标文本行（只读展示，供复制兜底）
  document.getElementById("fCoord").value=[seq, lng.toFixed(5), lat.toFixed(5), fmtTime(now)].join(",");
  coordRow.style.display="";
  // 保存到本机（家人端=自己的历史；管理端=直接落库）
  const rec={ rel:NUM_TO_CN[Number(seq)], lat:lat, lng:lng, time:now };
  state.records.push(rec); save();
  renderList();
  if(isFamily){
    locStatus.textContent="已记录，正在上传给风刀…";
    familyUpload(rec).then(ok=>{
      locStatus.textContent = ok ? "已上报风刀 ✓（下方坐标文本请留存作兜底）" : "已本地记录，但上传失败，请复制下方坐标文本发给风刀";
    });
  }else{
    locStatus.textContent="已获取并保存，复制坐标文本可发给家人";
  }
}
/* 家人端自动上传配置（token 优先级：内嵌 FAMILY_TOKEN → 本地同步配置） */
function familyCfg(){
  let c=null; try{ c=JSON.parse(localStorage.getItem(SYNC_KEY)); }catch(e){}
  return {
    owner:(c&&c.owner)||"fengdao2793",
    repo:(c&&c.repo)||"sync",
    branch:(c&&c.branch)||"main",
    path:(c&&c.path)||"locate.json",
    token:(FAMILY_TOKEN&&FAMILY_TOKEN.trim()) || (c&&c.token) || ""
  };
}
/* 家人端：把本地记录合并进远端 locate.json 后上传（避免覆盖他人数据），冲突重试一次 */
async function familyUpload(rec){
  const cfg=familyCfg();
  if(!cfg.token) return false;
  const base="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+cfg.path;
  const head=ghHeaders(cfg.token);
  async function mergeAndPut(){
    let sha=null, remote={records:[]};
    try{
      const g=await fetch(base+"?ref="+cfg.branch, {headers:head});
      if(g.ok){ const j=await g.json(); sha=j.sha; remote=JSON.parse(unb64(j.content)); }
      else if(g.status===404){ remote={records:[]}; }
      else return false;
    }catch(e){ return false; }
    if(!remote||!Array.isArray(remote.records)) remote={records:[]};
    const have=new Set(remote.records.map(r=>r.time));
    state.records.forEach(r=>{ if(!have.has(r.time)) remote.records.push(r); });
    if(!have.has(rec.time)) remote.records.push(rec);
    try{
      const r=await fetch(base,{method:"PUT",headers:head,
        body:JSON.stringify({message:"locate family update",content:b64(JSON.stringify({records:remote.records})),sha:sha,branch:cfg.branch})});
      return r.ok;
    }catch(e){ return false; }
  }
  if(await mergeAndPut()) return true;
  return await mergeAndPut(); /* 冲突重试一次 */
}
/* 复制家人链接：把带 ?relation=N 的链接发出去，家人打开即锁定该关系 */
famLinkBtn.onclick=()=>{
  const n=document.getElementById("relSel").value;
  const url=location.origin+location.pathname+"?relation="+n;
  navigator.clipboard.writeText(url).then(()=>toast("已复制家人链接（"+NUM_TO_CN[Number(n)]+"）")).catch(()=>toast("复制失败，请手动复制"));
};
copyCoordBtn.onclick=()=>{
  const s=document.getElementById("fCoord").value;
  navigator.clipboard.writeText(s).then(()=>toast("已复制坐标文本")).catch(()=>toast("复制失败，请手动复制"));
};

/* 风刀端：解析对方发来的坐标文本  序号,经度,纬度,时间 */
const parseInput=document.getElementById("parseInput");
const parseMsg=document.getElementById("parseMsg");
document.getElementById("parseBtn").onclick=()=>{
  const raw=parseInput.value.trim();
  if(!raw){ parseMsg.textContent="请先粘贴坐标文本"; return; }
  const parts=raw.split(/[,\s]+/).filter(Boolean);
  if(parts.length<4){ parseMsg.textContent="格式不对，应为：序号,经度,纬度,时间"; return; }
  const rel=NUM_TO_CN[Number(parts[0])];
  if(!rel){ parseMsg.textContent="序号无效（1=配偶 2=子女 3=本人 4=父 5=母）"; return; }
  const lng=parseFloat(parts[1]), lat=parseFloat(parts[2]);
  if(isNaN(lat)||isNaN(lng)){ parseMsg.textContent="经度或纬度不是数字"; return; }
  const t=Date.parse(parts.slice(3).join(" ").replace(" ","T"));
  const rec={ rel:rel, lat:lat, lng:lng, time:isNaN(t)?Date.now():t };
  state.records.push(rec); save();
  parseMsg.textContent="已添加 "+rel+" 的位置，正在解析地址…";
  parseInput.value="";
  if(!rec.addr) geocodeRecord(rec); else renderList();
};

/* 列表：5 个关系分区，区内按时间降序 */
function pad(n){ return ("0"+n).slice(-2); }
function fmtTime(t){
  const d=new Date(t);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function relReportUrl(relName){ return location.origin+location.pathname+"?relation="+CN_TO_NUM[relName]; }
function renderList(){
  const relsToShow = viewRel ? [viewRel] : RELS;
  const list=document.getElementById("list");
  list.innerHTML=relsToShow.map(rel=>{
    const recs=state.records.filter(r=>r.rel===rel).sort((a,b)=>b.time-a.time);
    // 风刀端：在每个关系标题下方给出该家人的上报链接（固定不变，点击即复制）
    const linkLine = (!isFamily)
      ? '<span class="rel-link" data-url="'+relReportUrl(rel)+'" title="点击复制该家人的上报链接"><u>'+relReportUrl(rel)+'</u></span>'
      : '';
    const items=recs.map(r=>{
      let addr;
      if(r.addr) addr=esc(r.addr);
      else if(r.geoPending) addr='<span class="muted">解析中…</span>';
      else addr='坐标 '+Number(r.lat).toFixed(5)+', '+Number(r.lng).toFixed(5);
      if(isFamily){
        /* 家人端：去掉解析地址/在地图查看；删除挪到坐标行(原解析地址位置)，日期时间置最右侧 */
        return '<div class="item"><div class="addr-row">'+
          '<span class="addr">'+addr+'</span>'+
          '<button class="del" data-time="'+r.time+'">删除</button>'+
          '<span class="ftime">'+fmtTime(r.time)+'</span>'+
          '</div></div>';
      }
      const map="https://www.openstreetmap.org/?mlat="+r.lat+"&mlon="+r.lng+"#map=16/"+r.lat+"/"+r.lng;
      return '<div class="item"><div class="addr">'+addr+' <button class="rep" data-time="'+r.time+'">解析地址</button></div>'+
        '<div class="meta"><span>'+fmtTime(r.time)+'</span>'+
        '<a href="'+map+'" target="_blank" rel="noopener">在地图查看</a>'+
        '<button class="del" data-time="'+r.time+'">删除</button></div></div>';
    }).join("") || '<div class="empty">暂无记录</div>';
    return '<div class="sec"><h3>'+rel+' <span class="cnt">'+recs.length+'</span>'+linkLine+'</h3>'+items+'</div>';
  }).join("");
  list.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    const tm=+b.dataset.time;
    state.records=state.records.filter(r=>r.time!==tm); save(); renderList();
  });
  list.querySelectorAll(".rep").forEach(b=>b.onclick=()=>{
    const tm=+b.dataset.time;
    const rec=state.records.find(r=>r.time===tm);
    if(rec){ rec.geoErr=false; geocodeRecord(rec); }
  });
  list.querySelectorAll(".rel-link").forEach(b=>b.onclick=()=>{
    const url=b.dataset.url;
    navigator.clipboard.writeText(url).then(()=>toast("已复制上报链接（"+NUM_TO_CN[Number(new URL(url).searchParams.get("relation"))]+"）")).catch(()=>toast("复制失败，请手动复制"));
  });
}

/* 本地导出 / 导入 */
function exportFile(){
  if(!state.records.length){ toast("当前没有任何位置记录可导出"); return; }
  const data=JSON.stringify(state,null,2);
  const blob=new Blob([data],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const d=new Date(), p=x=>(x<10?"0":"")+x;
  const name="locate-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+".json";
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("已导出 "+name+"（"+state.records.length+" 条记录）");
}
function importFile(input){
  const file=input.files&&input.files[0];
  if(!file){ return; }
  const reader=new FileReader();
  reader.onload=()=>{
    let remote;
    try{ remote=JSON.parse(reader.result); }catch(e){ toast("导入失败：文件不是合法 JSON",true); input.value=""; return; }
    if(Array.isArray(remote)) remote={records:remote};
    if(!remote||!Array.isArray(remote.records)){ toast("导入失败：文件结构无法识别",true); input.value=""; return; }
    if(!confirm("导入将覆盖当前本地位置数据（覆盖前会自动备份旧数据到 localStorage 备份键），确定继续？")){ input.value=""; return; }
    try{
      localStorage.setItem(KEY+"_bak", JSON.stringify(state));
      state={records:remote.records}; save(); renderList(); toast("已导入："+state.records.length+" 条记录（旧数据已备份）");
    }catch(e){ toast("导入失败："+((e&&e.message)||e),true); }
    input.value="";
  };
  reader.onerror=()=>{ toast("读取文件失败",true); input.value=""; };
  reader.readAsText(file);
}
document.getElementById("exportBtn").onclick=exportFile;
document.getElementById("importBtn").onclick=()=>document.getElementById("importInput").click();

/* GitHub 同步（默认填好，token 你自己填） */
function fillCfg(){
  let c=null; try{ c=JSON.parse(localStorage.getItem(SYNC_KEY)); }catch(e){}
  const def={owner:"fengdao2793",repo:"sync",branch:"main",path:"locate.json"};
  document.getElementById("sOwner").value=(c&&c.owner)||def.owner;
  document.getElementById("sRepo").value=(c&&c.repo)||def.repo;
  document.getElementById("sBranch").value=(c&&c.branch)||def.branch;
  document.getElementById("sPath").value=(c&&c.path)||def.path;
  if(c&&c.token) document.getElementById("sToken").value=c.token;
}
function readCfg(){
  const cfg={
    owner:document.getElementById("sOwner").value.trim(),
    repo:document.getElementById("sRepo").value.trim(),
    branch:document.getElementById("sBranch").value.trim()||"main",
    path:document.getElementById("sPath").value.trim()||"locate.json",
    token:document.getElementById("sToken").value.trim()
  };
  localStorage.setItem(SYNC_KEY,JSON.stringify(cfg));
  return cfg;
}
function setMsg(m,kind){ const e=document.getElementById("syncMsg"); if(!e) return; e.textContent=m; e.className="sync-msg"+(kind?" "+kind:""); }
function ghHeaders(token){ return {"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/vnd.github+json"}; }
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function unb64(s){ return decodeURIComponent(escape(atob(s))); }

document.getElementById("syncBtn").onclick=()=>{
  const p=document.getElementById("syncPanel");
  if(p.hidden){ fillCfg(); p.hidden=false; }
  else p.hidden=true;
};
document.getElementById("saveSyncBtn").onclick=()=>{ if(readCfg()) setMsg("配置已保存（下次自动填充）","ok"); };

document.getElementById("pushBtn").onclick=async()=>{
  const cfg=readCfg();
  if(!cfg.token){ setMsg("请先填写 token"); return; }
  setMsg("上传中…");
  let sha;
  try{
    const g=await fetch("https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+cfg.path+"?ref="+cfg.branch,{headers:ghHeaders(cfg.token)});
    if(g.ok){ const j=await g.json(); sha=j.sha; }
  }catch(e){}
  const body=JSON.stringify({message:"locate update",content:b64(JSON.stringify(state)),sha:sha,branch:cfg.branch});
  try{
    const r=await fetch("https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+cfg.path,{method:"PUT",headers:ghHeaders(cfg.token),body:body});
    setMsg(r.ok?"已更新到 GitHub":"失败："+(await r.text()).slice(0,80));
  }catch(e){ setMsg("网络错误："+e.message); }
};
document.getElementById("pullBtn").onclick=async()=>{
  const cfg=readCfg();
  if(!cfg.token){ setMsg("请先填写 token"); return; }
  setMsg("拉取中…");
  try{
    const r=await fetch("https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+cfg.path+"?ref="+cfg.branch,{headers:ghHeaders(cfg.token)});
    if(!r.ok){ setMsg("拉取失败："+(await r.text()).slice(0,80)); return; }
    const j=await r.json();
    const incoming=JSON.parse(unb64(j.content));
    if(incoming&&incoming.records){
      const have=new Set(state.records.map(r=>r.time));
      incoming.records.forEach(r=>{ if(!have.has(r.time)) state.records.push(r); });
      save(); renderList(); setMsg("已从 GitHub 更新（合并 "+incoming.records.length+" 条）","ok");
    }else setMsg("远端无数据");
  }catch(e){ setMsg("网络错误："+e.message); }
};

/* 风刀端：打开时静默从 GitHub 拉取一次（合并远端记录到本地，不弹提示） */
async function autoPull(){
  let c=null; try{ c=JSON.parse(localStorage.getItem(SYNC_KEY)); }catch(e){}
  const token=(c&&c.token)||"";
  if(!token) return;
  const cfg={owner:(c&&c.owner)||"fengdao2793",repo:(c&&c.repo)||"sync",branch:(c&&c.branch)||"main",path:(c&&c.path)||"locate.json",token:token};
  try{
    const r=await fetch("https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+cfg.path+"?ref="+cfg.branch,{headers:ghHeaders(cfg.token)});
    if(!r.ok) return;
    const j=await r.json();
    const incoming=JSON.parse(unb64(j.content));
    if(incoming&&Array.isArray(incoming.records)){
      const have=new Set(state.records.map(x=>x.time));
      let added=0;
      incoming.records.forEach(x=>{ if(!have.has(x.time)){ state.records.push(x); added++; } });
      if(added){ save(); renderList(); }
    }
  }catch(e){}
}

/* 连通性自检：测一下浏览器能否连到 GitHub API（与同步/上传同一主机） */
function httpMeaning(s){
  return ({401:"令牌无效或无权限",403:"可能被限流或令牌权限不足",404:"接口路径不存在",500:"GitHub 服务器错误"})[s] || "未知状态";
}
function networkMeaning(e){
  const m=(e&&e.message)||"";
  if(e&&e.name==="AbortError") return "连接超时（8 秒内无响应，多半是代理未接管或网络太慢）";
  if(/Failed to fetch/i.test(m)) return "网络层失败——浏览器多半没走代理/被墙，或 DNS 解析不到 api.github.com（按 F12→Network 看具体的 net::ERR_*：PROXY_CONNECTION_FAILED=代理没接管；CONNECTION_RESET/NAME_NOT_RESOLVED=网络或 DNS 问题）";
  return m || "未知网络错误";
}
document.getElementById("connBtn").onclick=async()=>{
  const msg=document.getElementById("connMsg");
  msg.className="conn-msg"; msg.textContent="检测中…";
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),8000);
  try{
    const r=await fetch("https://api.github.com/rate_limit",{signal:ctrl.signal});
    clearTimeout(timer);
    if(r.ok){ msg.className="conn-msg ok"; msg.textContent="✓ 可连通 GitHub API（api.github.com 可达，同步/上传网络没问题）"; }
    else{ msg.className="conn-msg err"; msg.textContent="✗ GitHub 返回 "+r.status+"（"+httpMeaning(r.status)+"）"; }
  }catch(e){
    clearTimeout(timer);
    msg.className="conn-msg err"; msg.textContent="✗ 连不上 GitHub："+networkMeaning(e);
  }
};
