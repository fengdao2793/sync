<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的小工具箱</title>
<style>
:root{
  --bg:#ffffff; --surface:#f6f8fa; --card:#ffffff; --border:#d0d7de; --soft:#eaeef2;
  --text:#1f2328; --muted:#656d76; --accent:#0969da; --accent-soft:#ddf4ff;
  --green:#1a7f37; --red:#cf222e; --red-soft:#ffecec; --shadow:0 1px 3px rgba(31,35,40,.08);
}
[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b22; --card:#0d1117; --border:#30363d; --soft:#21262d;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent-soft:#121d2f;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;padding:28px 16px 56px}
.wrap{max-width:920px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:0 0 22px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);
  border-radius:6px;padding:6px 12px;cursor:pointer}
.btns button:hover{background:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid.col1{grid-template-columns:1fr}
@media(max-width:640px){ .grid{grid-template-columns:1fr} }
.card{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);
  transition:border-color .15s,transform .1s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .en{font-size:12px;color:var(--muted);letter-spacing:.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.card .cn{font-size:18px;font-weight:600;margin:2px 0 8px}
.card .desc{font-size:13px;color:var(--muted);min-height:38px}
.card .meta{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .go{font-size:13px;color:var(--accent);font-weight:600}
.card .go::after{content:" →"}
.card .date{font-size:12px;color:var(--muted);white-space:nowrap}
.foot{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
.foot a{color:var(--accent);text-decoration:underline}
.foot a:hover{opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>我的小工具箱</h1>
    <div class="btns">
      <button id="themeBtn">切到暗色</button>
      <button id="dateBtn">按日期排序</button>
      <button id="layoutBtn">竖排</button>
    </div>
  </div>
  <p class="sub">四个纯前端小工具，数据存浏览器本地，可跨设备同步。点卡片直接进。</p>
  <div class="grid" id="grid"></div>
  <p class="foot">fengdao2793 · <a href="https://github.com" target="_blank" rel="noopener">GitHub Pages</a> · 单文件工具集</p>
</div>
<script>
const TOOLS=[
  {en:"birthday", cn:"生日",     date:"2026-11-09", desc:"农历/阳历生日记录，自动算年龄·生肖·星座·下次生日"},
  {en:"bookmark", cn:"书签同步", date:"2026-11-06", desc:"分类书签管理，跨设备同步，网页可达性检测"},
  {en:"locate",   cn:"位置定位", date:"2026-11-13", desc:"家人定位上报，分享链接汇总，按关系分组展示"},
  {en:"price",    cn:"价格比对", date:"2026-10-03", desc:"商品价格记录与历史比对"},
  {en:"todo",     cn:"待办",     date:"2026-09-07", desc:"待办事项管理，支持置顶与跨设备同步"}
];
const grid=document.getElementById("grid");
let sortMode="en"; // 'en' 按英文名 | 'date' 按创建日期
function cardHTML(t){
  return '<a class="card" href="'+t.en+'.html">'+
    '<div class="en">'+t.en+'.html</div>'+
    '<div class="cn">'+t.cn+'</div>'+
    '<div class="desc">'+t.desc+'</div>'+
    '<div class="meta"><span class="go">进入</span><span class="date">创建于 '+t.date+'</span></div>'+
  '</a>';
}
function render(){
  const list=TOOLS.slice().sort((a,b)=>
    sortMode==="date" ? a.date.localeCompare(b.date) : a.en.localeCompare(b.en)
  );
  grid.innerHTML=list.map(cardHTML).join("");
}
render();

const themeBtn=document.getElementById("themeBtn");
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  localStorage.setItem("index_theme",t);
  themeBtn.textContent = t==="dark" ? "切到亮色" : "切到暗色";
}
let saved=localStorage.getItem("index_theme");
if(!saved){ saved = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
applyTheme(saved);
themeBtn.addEventListener("click",()=>{
  applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
});

// 排序切换：英文名 ↔ 创建日期
const dateBtn=document.getElementById("dateBtn");
dateBtn.addEventListener("click",()=>{
  sortMode = sortMode==="date" ? "en" : "date";
  dateBtn.textContent = sortMode==="date" ? "按名称排序" : "按日期排序";
  render();
});
// 展示方式切换：网格 ↔ 单列竖排
const layoutBtn=document.getElementById("layoutBtn");
layoutBtn.addEventListener("click",()=>{
  const col1=grid.classList.toggle("col1");
  layoutBtn.textContent = col1 ? "横排" : "竖排";
});
</script>
</body>
</html>
