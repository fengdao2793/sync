<!DOCTYPE html>
<html lang="zh-CN" data-theme="light"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书签 bookmark</title>
<style>
:root{
  --bg:#ffffff; --surface:#f6f8fa; --card:#ffffff; --border:#d0d7de; --soft:#eaeef2;
  --text:#1f2328; --muted:#656d76; --accent:#0969da; --accent-soft:#ddf4ff;
  --green:#1a7f37; --red:#cf222e; --shadow:0 1px 3px rgba(31,35,40,.08);
}
[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b22; --card:#0d1117; --border:#30363d; --soft:#21262d;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent-soft:#121d2f;
  --green:#3fb950; --red:#f85149; --shadow:0 1px 3px rgba(1,4,9,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;transition:background .2s,color .2s}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:20px;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.tools{display:flex;gap:8px;align-items:center}
button,input,textarea{font:inherit;color:var(--text);background:var(--card);
  border:1px solid var(--border);border-radius:6px;padding:6px 10px;outline:none}
button{cursor:pointer;background:var(--surface)}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--red)}
button.danger:hover{border-color:var(--red)}
button:disabled{opacity:.5;cursor:default}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* 同步面板（与 price 一致：header 下方内嵌折叠卡片） */
.sync{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;box-shadow:var(--shadow);margin-bottom:14px}
.sync-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.sync-tip{font-size:12px;color:var(--muted)}
.sync-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sync-row label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync-row label.grow{flex:1;min-width:260px}
.sync-row input[type=text],.sync-row input[type=password]{flex:1;min-width:120px}
.sync-row .slash{color:var(--muted)}
.sync-msg{font-size:12px;margin-left:auto}
.sync-msg.ok{color:var(--green)}
.sync-msg.err{color:var(--red)}

/* 两栏布局：左分类树 + 右内容 */
.layout{display:flex;gap:16px;align-items:flex-start}
.side{flex:0 0 280px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;position:sticky;top:20px}
.addcat{margin-top:8px;width:100%;background:var(--soft);border:1px solid var(--border);border-radius:8px}
.tree{list-style:none;margin:0;padding:0}
.tree ul{padding-left:12px;border-left:1px solid var(--border);margin-left:9px}
.node{display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;border:1px solid transparent;margin-bottom:2px;font-size:13px;line-height:1.25;user-select:none;cursor:default}
.node[draggable=true]{cursor:grab}
.node:hover{background:var(--soft)}
.node.sel{background:var(--accent-soft)}
.node.sel .nname{color:var(--accent);font-weight:600}
.node.sel .bmcnt{color:var(--accent)}
.node.dragging{opacity:.4}
.node.drag-over{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.arrow{width:16px;text-align:center;color:var(--muted);cursor:pointer;flex:none;font-size:11px}
.nname{flex:1;min-width:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmcnt{font-size:12px;color:var(--muted);margin-left:8px}
.ops{display:none;gap:2px;flex:none}
.node:hover .ops{display:flex}
.ops button{padding:0 6px;font-size:12px;line-height:1.3;border-radius:5px}
.move-ops{display:flex;gap:1px;flex:none;margin-left:4px}
.move-ops button{padding:0 3px;font-size:11px;line-height:1.3;border-radius:5px;color:var(--muted)}
.move-ops button:hover{border-color:var(--accent);color:var(--accent)}
.move-ops button:disabled{opacity:.25;cursor:default;border-color:var(--border);color:var(--muted)}
.tree-hint{color:var(--muted);font-size:12px;padding:8px 6px}

.main{flex:1;min-width:0}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar h2{font-size:17px;margin:0;flex:1}
.bar .cnt{color:var(--muted);font-size:12px}
.crumb{color:var(--muted);font-size:12px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.bm-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--card)}
.bm-left{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.bm-title{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;flex:none}
.bm-title:hover{text-decoration:underline}
.bm-url{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;flex:none}
.bm-note{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;flex:none}
.bm-acts{display:flex;gap:6px;flex:none}
.empty{text-align:center;color:var(--muted);padding:30px 0;border:1px dashed var(--border);border-radius:8px}
.addcard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
.addcard h3{margin:0 0 10px;font-size:14px}
.addcard .addgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:end}
.addcard .fld{display:flex;flex-direction:column;min-width:0}
.addcard label{font-size:12px;color:var(--muted);margin:0 0 3px}
.addcard input{width:100%;padding:7px 9px}
.addcard .fld.btns{display:flex;flex-direction:row;justify-content:flex-end;align-items:flex-end;gap:8px}
.addcard .fld.btns button{padding:7px 16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;box-shadow:var(--shadow);font-size:13px;z-index:50;max-width:80%}
.toast.err{color:var(--red);border-color:var(--red)}
footer{margin-top:24px;color:var(--muted);font-size:12px;text-align:center;line-height:1.9}
@media(max-width:760px){
  .layout{flex-direction:column}
  .side{position:static;flex:none;width:100%}
  .bm-title{max-width:42%}
  .bm-url{max-width:42%}
  .bm-note{max-width:30%}
  .addcard .addgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🔖 书签同步</h1>
      <div class="sub">任意层级均可挂书签 · 本地存储 · GitHub 同步</div>
    </div>
    <div class="tools">
      <button id="themeBtn" title="切换亮色/暗色">暗色</button>
      <button id="exportBtn" title="把书签数据导出成 JSON 文件（备份/迁移）">导出</button>
      <button id="importBtn" title="从 JSON 文件导入书签数据（覆盖前自动备份）">导入</button>
      <button id="syncBtn" title="GitHub 同步设置">同步</button>
    </div>
  </header>

  <div class="sync" id="syncPanel" hidden>
    <div class="sync-head">
      <strong>GitHub 同步</strong>
      <span class="sync-tip">「更新到Github」= 把当前书签写成 bookmark.json 上传（app 本身 bookmark.html 不上传）；「从Github更新」= 读回远端 bookmark.json 数据覆盖本地（旧数据自动备份）</span>
    </div>
    <div class="sync-row">
      <label>仓库 owner/repo
        <input type="text" id="sOwner" placeholder="yourname" autocomplete="off">
        <span class="slash">/</span>
        <input type="text" id="sRepo" placeholder="sync" autocomplete="off">
      </label>
      <label>分支<input type="text" id="sBranch" placeholder="main" autocomplete="off"></label>
      <label>文件路径<input type="text" id="sPath" placeholder="bookmark.json" autocomplete="off"></label>
    </div>
    <div class="sync-row">
      <label class="grow">Token（fine-grained，仅授权该仓库 contents 读写）
        <input type="password" id="sToken" placeholder="github_pat_xxx" autocomplete="off">
      </label>
    </div>
    <div class="sync-row">
      <button id="saveSyncBtn">保存配置</button>
      <button class="primary" id="pushBtn">更新到Github</button>
      <button id="pullBtn">从Github更新</button>
      <span id="syncMsg" class="sync-msg"></span>
    </div>
  </div>

  <div class="layout">
    <aside class="side">
      <ul class="tree" id="tree"></ul>
      <button class="addcat" id="addTopBtn">＋ 新建分类</button>
    </aside>
    <section class="main" id="detail"></section>
  </div>

  <footer>
    数据存于本机 localStorage（键名 bookmark_v1）；跨设备用「更新到Github」上传 bookmark.json，另一台设备打开后用「从Github更新」读回数据
  </footer>
</div>

<input type="file" id="importInput" accept=".json,application/json" hidden onchange="importFile(this)">
<div id="toast"></div>

<script>
/* ====== 本地存储 ====== */
var KEY="bookmark_v1", KEY_SYNC="bookmark_sync", THEME="bookmark_theme";
var state={ tree:[] };
var selectedId=null;
var expanded={};            /* 分类 id -> 是否展开 */
var editBmId=null;          /* 正在编辑的书签 id（null=新增） */

function genId(){ return "bm"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function escapeAttr(s){ return escapeHtml(s); }
function toast(m,err){
  var t=document.getElementById("toast"); if(!t) return;
  t.textContent=m; t.className="toast show"+(err?" err":"");
  setTimeout(function(){ t.className="toast"; },2500);
}
/* 规范化：确保每个节点都有 children 与 bookmarks 两个数组（兼容旧数据） */
function normalizeNode(n){
  if(!n.children) n.children=[];
  if(!n.bookmarks) n.bookmarks=[];
  n.children.forEach(normalizeNode);
  return n;
}
function load(){
  try{ var r=localStorage.getItem(KEY); if(r) state=JSON.parse(r); }catch(e){}
  if(!state || !Array.isArray(state.tree)) state={ tree:[] };
  state.tree.forEach(normalizeNode);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast("保存失败，可能存储已满或被禁用",true); } }
function countBookmarks(list){
  list=list||state.tree; var c=0;
  list.forEach(function(n){ if(n.bookmarks) c+=n.bookmarks.length; if(n.children) c+=countBookmarks(n.children); });
  return c;
}
/* 在树中查找节点：返回 {node,parent,level,list,index} */
function find(id, list, parent, level){
  list=list||state.tree;
  for(var i=0;i<list.length;i++){
    var n=list[i];
    if(n.id===id) return {node:n,parent:parent,level:level,list:list,index:i};
    if(n.children){ var r=find(id,n.children,n,level+1); if(r) return r; }
  }
  return null;
}
/* 返回从根到某节点的名称路径数组 */
function pathOf(id, list, acc){
  list=list||state.tree; acc=acc||[];
  for(var i=0;i<list.length;i++){
    var n=list[i];
    var a=acc.concat(n.name);
    if(n.id===id) return a;
    if(n.children){ var r=pathOf(id,n.children,a); if(r) return r; }
  }
  return null;
}

/* ====== 分类操作 ====== */
function addTop(){
  var n={id:genId(),name:"新一级分类",children:[],bookmarks:[]};
  state.tree.push(n); expanded[n.id]=true;
  save(); render(); select(n.id);
}
function addChild(parentId){
  var f=find(parentId); if(!f||f.level>=3) return;   /* 最多三级：第三级不再允许加子分类 */
  var n={id:genId(),name:"新分类",children:[],bookmarks:[]};
  f.node.children.push(n); expanded[n.id]=true; expanded[parentId]=true;
  save(); render(); select(n.id);
}
function renameCat(id){
  var f=find(id); if(!f) return;
  var v=prompt("分类名称", f.node.name);
  if(v===null) return; v=v.trim(); if(!v) return;
  f.node.name=v; save(); render();
}
function removeCat(id){
  var f=find(id); if(!f) return;
  var cnt=countBookmarks([f.node]);
  if(!confirm("删除分类「"+f.node.name+"」"+(cnt?("及其下 "+cnt+" 个书签"):"")+"？")) return;
  f.list.splice(f.index,1);
  if(selectedId===id) selectedId=null;
  save(); render();
}
/* 同级上下移动：dir=-1 上移 / +1 下移 */
function moveCat(id, dir){
  var f=find(id); if(!f) return;
  var list=f.list, i=f.index, j=i+dir;
  if(j<0 || j>=list.length) return;   /* 已在同级首尾 */
  var tmp=list[i]; list[i]=list[j]; list[j]=tmp;
  save(); render();
}
/* ====== 分类拖拽排序（仅同级） ====== */
var dragId=null;
function nodeDragStart(e,id){
  dragId=id;
  e.dataTransfer.effectAllowed="move";
  try{ e.dataTransfer.setData("text/plain",id); }catch(_){}
  e.currentTarget.classList.add("dragging");
}
function nodeDragOver(e,id){
  if(dragId===null) return;
  var s=find(dragId), t=find(id);
  if(!s||!t||s.level!==t.level) return;   /* 仅同级排序 */
  e.preventDefault();
  e.currentTarget.classList.add("drag-over");
}
function nodeDragDrop(e,id){
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  if(dragId===null) return;
  var s=find(dragId), t=find(id);
  if(!s||!t||s.level!==t.level||s.list!==t.list){ dragId=null; return; }
  var list=s.list, si=s.index, ti=t.index;
  if(si===ti){ dragId=null; return; }
  var moved=list.splice(si,1)[0];
  if(si<ti) ti--;
  list.splice(ti,0,moved);
  dragId=null; save(); render();
}

/* ====== 书签操作（任意层级均可添加） ====== */
function addOrUpdateBookmark(){
  var f=find(selectedId);
  if(!f){ toast("请先在左侧选择一个分类",true); return; }
  var title=document.getElementById("fTitle").value.trim();
  var url=document.getElementById("fUrl").value.trim();
  var note=document.getElementById("fNote").value.trim();
  if(!title||!url){ toast("标题和链接必填",true); return; }
  if(!/^https?:\/\//i.test(url)) url="https://"+url;
  if(!f.node.bookmarks) f.node.bookmarks=[];
  if(editBmId){
    var bm=f.node.bookmarks.filter(function(x){return x.id===editBmId;})[0];
    if(bm){ bm.title=title; bm.url=url; bm.note=note; }
    editBmId=null;
  } else {
    f.node.bookmarks.push({id:genId(),title:title,url:url,note:note,created:Date.now()});
  }
  document.getElementById("fTitle").value="";
  document.getElementById("fUrl").value="";
  document.getElementById("fNote").value="";
  setFormTitle("＋ 添加书签到「"+f.node.name+"」");
  var sb=document.getElementById("bmSubmit"); if(sb) sb.textContent="添加书签";
  save(); render();
}
function editBookmark(bmId){
  var f=find(selectedId); if(!f||!f.node.bookmarks) return;
  var bm=f.node.bookmarks.filter(function(x){return x.id===bmId;})[0]; if(!bm) return;
  editBmId=bmId;
  document.getElementById("fTitle").value=bm.title;
  document.getElementById("fUrl").value=bm.url;
  document.getElementById("fNote").value=bm.note||"";
  setFormTitle("保存修改");
  var sb=document.getElementById("bmSubmit"); if(sb) sb.textContent="保存修改";
}
function removeBookmark(bmId){
  var f=find(selectedId); if(!f||!f.node.bookmarks) return;
  f.node.bookmarks=f.node.bookmarks.filter(function(x){return x.id!==bmId;});
  if(editBmId===bmId) editBmId=null;
  save(); render();
}
function setFormTitle(t){ var h=document.getElementById("formTitle"); if(h) h.textContent=t; }
/* 书签列表内拖拽排序：把 srcId 移到 tgtId 之前 */
function moveBookmark(srcId, tgtId){
  if(!srcId||!tgtId||srcId===tgtId) return;
  var f=find(selectedId); if(!f||!f.node.bookmarks) return;
  var arr=f.node.bookmarks;
  var si=arr.findIndex(function(x){return x.id===srcId;});
  var ti=arr.findIndex(function(x){return x.id===tgtId;});
  if(si<0||ti<0) return;
  var moved=arr.splice(si,1)[0];
  var ti2=arr.findIndex(function(x){return x.id===tgtId;});
  if(ti2<0) ti2=arr.length;
  arr.splice(ti2,0,moved);
  save(); render();
}
function resetForm(){
  editBmId=null;
  document.getElementById("fTitle").value="";
  document.getElementById("fUrl").value="";
  document.getElementById("fNote").value="";
  var f=find(selectedId);
  setFormTitle(f? ("＋ 添加书签到「"+f.node.name+"」") : "＋ 添加书签");
  var sb=document.getElementById("bmSubmit"); if(sb) sb.textContent="添加书签";
}

/* ====== 渲染 ====== */
function select(id){ selectedId=id; render(); }

function nodeEl(n, level){
  var li=document.createElement("li");
  var row=document.createElement("div"); row.className="node"+(n.id===selectedId?" sel":"");
  var hasChild = n.children && n.children.length;
  var bmCount = (n.bookmarks||[]).length;
  var arrow=document.createElement("span"); arrow.className="arrow";
  if(hasChild){
    if(expanded[n.id]===undefined) expanded[n.id]=true;
    arrow.textContent = expanded[n.id] ? "▾" : "▸";
    arrow.onclick=function(e){ e.stopPropagation(); expanded[n.id]=!expanded[n.id]; render(); };
  }
  var name=document.createElement("span"); name.className="nname"; name.textContent=n.name;
  name.title=n.name; name.onclick=function(){ select(n.id); };
  var ops=document.createElement("span"); ops.className="ops";
  if(level<3){
    var bAdd=document.createElement("button"); bAdd.textContent="＋"; bAdd.title="添加子分类";
    bAdd.onclick=function(e){ e.stopPropagation(); addChild(n.id); };
    ops.appendChild(bAdd);
  }
  var bRen=document.createElement("button"); bRen.textContent="改"; bRen.title="重命名";
  bRen.onclick=function(e){ e.stopPropagation(); renameCat(n.id); };
  var bDel=document.createElement("button"); bDel.textContent="删"; bDel.title="删除";
  bDel.onclick=function(e){ e.stopPropagation(); removeCat(n.id); };
  ops.appendChild(bRen); ops.appendChild(bDel);
  row.appendChild(arrow); row.appendChild(name);
  if(bmCount){ var c=document.createElement("span"); c.className="bmcnt"; c.textContent="📑"+bmCount; row.appendChild(c); }
  row.appendChild(ops);
  var f0=find(n.id);
  var mo=document.createElement("span"); mo.className="move-ops";
  var up=document.createElement("button"); up.textContent="↑"; up.title="上移（同级）";
  up.disabled = f0 && f0.index===0;
  up.onclick=function(e){ e.stopPropagation(); moveCat(n.id,-1); };
  var dn=document.createElement("button"); dn.textContent="↓"; dn.title="下移（同级）";
  dn.disabled = f0 && f0.index===f0.list.length-1;
  dn.onclick=function(e){ e.stopPropagation(); moveCat(n.id,1); };
  mo.appendChild(up); mo.appendChild(dn); row.appendChild(mo);
  row.draggable=true;
  row.addEventListener("dragstart",function(e){ nodeDragStart(e,n.id); });
  row.addEventListener("dragover",function(e){ nodeDragOver(e,n.id); });
  row.addEventListener("dragleave",function(e){ e.currentTarget.classList.remove("drag-over"); });
  row.addEventListener("drop",function(e){ nodeDragDrop(e,n.id); });
  row.addEventListener("dragend",function(e){ e.currentTarget.classList.remove("dragging"); var ov=document.querySelectorAll(".node.drag-over"); if(ov) ov.forEach(function(x){x.classList.remove("drag-over");}); dragId=null; });
  li.appendChild(row);
  if(hasChild && expanded[n.id]){
    var ul=document.createElement("ul"); ul.className="tree";
    n.children.forEach(function(c){ ul.appendChild(nodeEl(c, level+1)); });
    li.appendChild(ul);
  }
  return li;
}
function renderTree(){
  var root=document.getElementById("tree"); root.innerHTML="";
  if(!state.tree.length){ root.innerHTML='<li class="tree-hint">还没有分类，点下方「＋ 新建一级分类」。</li>'; return; }
  state.tree.forEach(function(n){ root.appendChild(nodeEl(n,1)); });
}
function renderMain(){
  var box=document.getElementById("detail");
  var bar='<div class="bar"><h2>🔖 我的书签</h2><span class="cnt">'+state.tree.length+' 个一级分类 · '+countBookmarks()+' 个书签</span></div>';
  var f = selectedId ? find(selectedId) : null;
  if(!f){

  var bms = f.node.bookmarks || [];

  html+='<div class="card"><div class="bar"><h2>📁 '+escapeHtml(f.node.name)+'</h2><span class="cnt">'+bms.length+' 个书签</span></div>';

    bms.forEach(function(b){
      html+='<div class="bm-row" draggable="true" data-bmid="'+b.id+'"><span class="bm-handle" title="拖动排序">⠿</span><div class="bm-left">'
        +'<a class="bm-title" draggable="false" href="'+escapeAttr(b.url)+'" target="_blank" rel="noopener" title="'+escapeAttr(b.title)+'">'+escapeHtml(b.title)+'</a>'
        +'<span class="bm-url" title="'+escapeAttr(b.url)+'">'+escapeHtml(b.url)+'</span>'
        +(b.note?'<span class="bm-note" title="'+escapeAttr(b.note)+'">'+escapeHtml(b.note)+'</span>':'')
        +'</div><div class="bm-acts">'
        +'<button onclick="editBookmark(\''+b.id+'\')">编辑</button>'
        +'<button class="danger" onclick="removeBookmark(\''+b.id+'\')">删除</button>'
        +'</div></div>';
    });
  } else {
    html+='<div class="empty">这个分类下还没有书签</div>';
  }
  html+='</div>';
  html+='<div class="addcard"><h3 id="formTitle">＋ 添加书签到「'+escapeHtml(f.node.name)+'」</h3>'
    +'<div class="addgrid">'
    +'<div class="fld"><label>标题</label><input id="fTitle" placeholder="例如：WorkBuddy 官网"></div>'
    +'<div class="fld"><label>链接</label><input id="fUrl" placeholder="https://... 或粘贴裸域名自动补 https://"></div>'
    +'<div class="fld"><label>备注（可选）</label><input id="fNote" placeholder="一句话说明"></div>'
    +'<div class="fld btns"><button class="primary" id="bmSubmit" onclick="addOrUpdateBookmark()">添加书签</button>'
    +'<button onclick="resetForm()">清空</button></div>'
    +'</div></div>';
  box.innerHTML=html;
}

/* ====== GitHub 同步（与 todo/price 同一套机制） ====== */
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function ghHeaders(token,put){
  var h={ "Accept":"application/vnd.github+json", "Authorization":"Bearer "+token, "X-GitHub-Api-Version":"2022-11-28" };
  if(put) h["Content-Type"]="application/json";
  return h;
}
function saveCfg(cfg){ try{ localStorage.setItem(KEY_SYNC, JSON.stringify(cfg)); }catch(e){} }
function fillCfg(){
  var c=null;
  try{ c=JSON.parse(localStorage.getItem(KEY_SYNC)); }catch(e){}
  if(!c) c={ owner:"fengdao2793", repo:"sync", branch:"main", path:"bookmark.json" };
  if(c.owner) document.getElementById("sOwner").value=c.owner;
  if(c.repo) document.getElementById("sRepo").value=c.repo;
  if(c.branch) document.getElementById("sBranch").value=c.branch;
  if(c.path) document.getElementById("sPath").value=c.path;
  if(c.token) document.getElementById("sToken").value=c.token;
}
function readCfg(){
  var cfg={
    owner:document.getElementById("sOwner").value.trim(),
    repo:document.getElementById("sRepo").value.trim(),
    branch:document.getElementById("sBranch").value.trim()||"main",
    path:document.getElementById("sPath").value.trim()||"bookmark.json",
    token:document.getElementById("sToken").value.trim()
  };
  if(!cfg.owner||!cfg.repo){ msg("请先填写 owner / repo","err"); return null; }
  if(!cfg.token){ msg("请填写 Token（读写仓库需要授权）","err"); return null; }
  saveCfg(cfg);
  return cfg;
}
function b64decode(str){
  var bin=atob(String(str).replace(/\s+/g,""));
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if(typeof TextDecoder!=="undefined") return new TextDecoder("utf-8").decode(bytes);
  return decodeURIComponent(escape(bin));
}
function msg(m,kind){ var e=document.getElementById("syncMsg"); if(!e) return; e.textContent=m; e.className="sync-msg"+(kind?" "+kind:""); }
function apiGetRaw(cfg,path){
  var p=(path||cfg.path).split("/").map(encodeURIComponent).join("/");
  var url="https://api.github.com/repos/"+encodeURIComponent(cfg.owner)+"/"+encodeURIComponent(cfg.repo)+"/contents/"+p+"?ref="+encodeURIComponent(cfg.branch);
  return fetch(url,{headers:ghHeaders(cfg.token)}).then(function(r){
    if(r.status===404) return {notFound:true};
    if(!r.ok) return r.json().then(function(j){ throw new Error(j.message||("HTTP "+r.status)); });
    return r.json().then(function(j){ return Array.isArray(j) ? {isDir:true} : {json:j}; });
  });
}
function apiPut(cfg,content,sha,path){
  var p=(path||cfg.path).split("/").map(encodeURIComponent).join("/");
  var url="https://api.github.com/repos/"+encodeURIComponent(cfg.owner)+"/"+encodeURIComponent(cfg.repo)+"/contents/"+p;
  var body={ message:"bookmark sync "+new Date().toISOString(), content:content, branch:cfg.branch };
  if(sha) body.sha=sha;
  return fetch(url,{method:"PUT",headers:ghHeaders(cfg.token,true),body:JSON.stringify(body)}).then(function(r){
    if(!r.ok) return r.json().then(function(j){ throw new Error(j.message||("HTTP "+r.status)); });
    return r.json();
  });
}
function pushOne(cfg,f,retried){
  return apiGetRaw(cfg, f.path).then(function(res){
    if(res.isDir) throw new Error("远端 "+f.path+" 是个目录（仓库里存在同名文件夹），不能当文件写入：请在仓库里删掉该目录，或换一个文件路径");
    var sha=(res && res.json) ? res.json.sha : null;
    return apiPut(cfg, f.content, sha, f.path).catch(function(err){
      var m=(err&&err.message)||"";
      if(!retried && /sha/i.test(m)){
        return apiGetRaw(cfg, f.path).then(function(res2){
          if(res2.isDir) throw err;
          var sha2=(res2 && res2.json) ? res2.json.sha : null;
          if(!sha2) throw err;
          return apiPut(cfg, f.content, sha2, f.path);
        });
      }
      throw err;
    });
  });
}
function pushSync(){
  var cfg=readCfg(); if(!cfg) return;
  var btn=document.getElementById("pushBtn"); btn.disabled=true; msg("同步中…","");
  var files=[ { path:cfg.path, content:b64encode(JSON.stringify(state,null,2)) } ];
  var ok=[], bad=[];
  function step(i){
    if(i>=files.length){
      if(ok.length && bad.length) msg("部分成功：已更新 "+ok.join(" + ")+"；失败→ "+bad.join("；"),"err");
      else if(bad.length) msg("同步失败："+bad.join("；"),"err");
      else msg("已更新到Github："+ok.join(" + ")+"（一级分类 "+state.tree.length+" 个 / 书签 "+countBookmarks()+" 个）","ok");
      btn.disabled=false; return;
    }
    pushOne(cfg,files[i],false).then(function(){ ok.push(files[i].path); },
      function(e){ bad.push(files[i].path+": "+((e&&e.message)||e)); }
    ).then(function(){ step(i+1); });
  }
  step(0);
}
function armPull(btn, fn){
  if(btn.getAttribute("data-armed")==="1"){
    btn.removeAttribute("data-armed"); btn.classList.remove("armed");
    btn.textContent="从Github更新"; fn(); return;
  }
  btn.setAttribute("data-old", btn.textContent);
  btn.setAttribute("data-armed","1"); btn.textContent="确认覆盖本地？";
  btn.classList.add("armed");
  if(btn._t) clearTimeout(btn._t);
  btn._t=setTimeout(function(){
    btn.removeAttribute("data-armed"); btn.classList.remove("armed");
    btn.textContent=btn.getAttribute("data-old")||"从Github更新";
  },5000);
}
function applyRemote(remote){
  if(!remote || !Array.isArray(remote.tree)) throw new Error("远端数据结构无法识别");
  try{ localStorage.setItem(KEY+"_bak", JSON.stringify(state)); }catch(e){}
  state={ tree:remote.tree };
  state.tree.forEach(normalizeNode);
  selectedId=null; expanded={};
  save(); render();
  return state.tree.length;
}
function pullSync(){
  var cfg=readCfg(); if(!cfg) return;
  var btn=document.getElementById("pullBtn");
  if(btn._t) clearTimeout(btn._t);
  btn.removeAttribute("data-armed"); btn.classList.remove("armed");
  btn.disabled=true; btn.textContent="读取中…"; msg("读取中…","");
  apiGetRaw(cfg, cfg.path).then(function(res){
    if(res.notFound) throw new Error("远端还没有 "+cfg.path+"，请先「更新到Github」");
    if(res.isDir) throw new Error("远端 "+cfg.path+" 是个目录而不是文件，请在仓库里删掉它");
    var raw=res.json && res.json.content;
    if(!raw) throw new Error("接口没返回文件内容（检查 Token 权限与仓库可见性）");
    var text; try{ text=b64decode(raw); }catch(e){ throw new Error("远端文件解码失败"); }
    var remote; try{ remote=JSON.parse(text); }catch(e){ throw new Error("远端 "+cfg.path+" 不是合法 JSON（可能曾被当成目录写入，请在仓库删掉它）"); }
    if(!remote || !Array.isArray(remote.tree)) throw new Error("远端数据结构无法识别（应为 {tree}）");
    var n=applyRemote(remote);
    msg("已从Github更新（"+n+" 个一级分类 / "+countBookmarks()+" 个书签；旧数据已备份）","ok");
  }).catch(function(err){
    msg("更新失败："+((err&&err.message)||err),"err");
  }).then(function(){
    btn.disabled=false; btn.textContent="从Github更新";
  });
}
document.getElementById("syncBtn").onclick=function(){
  var p=document.getElementById("syncPanel");
  if(p.hidden){ fillCfg(); p.hidden=false; }
  else p.hidden=true;
};
document.getElementById("saveSyncBtn").onclick=function(){ var c=readCfg(); if(c) msg("配置已保存（下次自动填充）","ok"); };
document.getElementById("pushBtn").onclick=pushSync;
document.getElementById("pullBtn").onclick=function(){ armPull(this, pullSync); };

/* ====== 本地导出 / 导入（与 GitHub 无关，纯文件备份） ====== */
function exportFile(){
  if(!state.tree.length){ toast("当前没有任何书签可导出"); return; }
  var data=JSON.stringify(state,null,2);
  var blob=new Blob([data],{type:"application/json;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var d=new Date(), pad=function(x){ return (x<10?"0":"")+x; };
  var name="bookmark-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"-"+pad(d.getHours())+pad(d.getMinutes())+".json";
  var a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast("已导出 "+name+"（"+state.tree.length+" 个一级分类 / "+countBookmarks()+" 个书签）");
}
function importFile(input){
  var file=input.files && input.files[0];
  if(!file){ return; }
  var reader=new FileReader();
  reader.onload=function(){
    var remote;
    try{ remote=JSON.parse(reader.result); }
    catch(e){ toast("导入失败：文件不是合法 JSON",true); input.value=""; return; }
    if(Array.isArray(remote)) remote={ tree:remote };   /* 兼容直接导出的 tree 数组 */
    if(!remote || !Array.isArray(remote.tree)){ toast("导入失败：文件结构无法识别（应为书签数据）",true); input.value=""; return; }
    if(!confirm("导入将覆盖当前本地书签（覆盖前会自动备份旧数据到 localStorage 备份键），确定继续？")){ input.value=""; return; }
    try{
      var n=applyRemote(remote);
      toast("已导入："+n+" 个一级分类 / "+countBookmarks()+" 个书签（旧数据已备份）");
    }catch(e){ toast("导入失败："+((e&&e.message)||e),true); }
    input.value="";
  };
  reader.onerror=function(){ toast("读取文件失败",true); input.value=""; };
  reader.readAsText(file);
}
document.getElementById("exportBtn").onclick=exportFile;
document.getElementById("importBtn").onclick=function(){ document.getElementById("importInput").click(); };

/* 右侧书签拖拽排序（事件委托，innerHTML 重建不丢监听） */
(function(){
  var box=document.getElementById("detail");
  var bmDragId=null;
  box.addEventListener("dragstart", function(e){
    if(e.target.closest(".bm-acts")) return;
    var row=e.target.closest(".bm-row"); if(!row) return;
    bmDragId=row.getAttribute("data-bmid");
    row.classList.add("dragging");
    e.dataTransfer.effectAllowed="move";
    try{ e.dataTransfer.setData("text/plain",bmDragId); }catch(_){}
  });
  box.addEventListener("dragover", function(e){
    var row=e.target.closest(".bm-row"); if(!row||!bmDragId) return;
    e.preventDefault(); row.classList.add("drag-over");
  });
  box.addEventListener("dragleave", function(e){
    var row=e.target.closest(".bm-row"); if(row) row.classList.remove("drag-over");
  });
  box.addEventListener("drop", function(e){
    var row=e.target.closest(".bm-row"); if(!row||!bmDragId) return;
    e.preventDefault(); row.classList.remove("drag-over");
    moveBookmark(bmDragId, row.getAttribute("data-bmid"));
    bmDragId=null;
  });
  box.addEventListener("dragend", function(e){
    document.querySelectorAll(".bm-row.dragging,.bm-row.drag-over").forEach(function(x){x.classList.remove("dragging","drag-over");});
    bmDragId=null;
  });
})();
